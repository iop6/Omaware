; Formatting for OmaWare's QML: run `qmlformat -i qml/*.qml` (Qt 6.8 or later).
; Note: qmlformat crashes on a function declared inside a property binding; use a function expression there.
[General]
IndentWidth=4
MaxColumnWidth=-1
NewlineType=unix
NormalizeOrder=false
SemicolonRule=always
SortImports=false
UseTabs=false
